name: Linux

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  Linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dist:
          - ubuntu2404_clang
          - ubuntu2404_gcc
          - ubuntu2604_clang
          - ubuntu2604_gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build container
        run: docker build . -t ${{ matrix.dist }} -f docker/${{ matrix.dist }}.docker

      - name: Test
        run: docker run --rm ${{ matrix.dist }} /bin/bash -c 'cd /code/build && ctest --output-on-failure'
        

  Format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build container
        run: docker build . -t ubuntu2604_format -f docker/ubuntu2604_format.docker

      - name: Check formatting
        run: docker run --rm ubuntu2604_gcc /bin/bash -c 'cd /code && scripts/run-format.sh'
